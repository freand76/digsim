site_name: DigSim
site_description: Interactive Digital Logic Simulator
site_url: https://freand76.github.io/digsim/
repo_url: https://github.com/freand76/digsim
repo_name: freand76/digsim
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Installation: installation.md
  - Examples: examples.md
  - GUI Application:
      - Your First Circuit: first-circuit.md
      - GUI Reference: gui.md
      - Editing a Verilog Component: verilog-tutorial.md
      - Adding Components to the GUI: gui-components.md
  - Python:
      - Python Circuits: python.md
      - Verilog and Yosys: synthesis.md
      - Verilog Testbench with pytest: testbenches.md
      - Creating Components: components.md
  - API Reference:
      - Overview: api/index.md
      - Circuit: api/circuit.md
      - Components: api/components.md
      - Component Base Classes: api/base-classes.md
      - Ports: api/ports.md
      - Synthesis: api/synthesis.md
      - Yosys Netlist: api/netlist.md
      - Verilog: api/verilog.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md

exclude_docs: |
  documentation.md
  scripts/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]
            heading_level: 2

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: images/app_icon.png
  favicon: images/app_icon.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
