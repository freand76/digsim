site_name: DigSim
site_description: Interactive Digital Logic Simulator
site_url: https://freand76.github.io/digsim/
repo_url: https://github.com/freand76/digsim
repo_name: freand76/digsim
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Installation: installation.md
  - GUI Application: gui.md
  - Python Circuits: python.md
  - Verilog and Yosys: synthesis.md
  - Examples: examples.md
  - Creating Components: components.md
  - Contributing: contributing.md
  - Changelog: changelog.md

exclude_docs: |
  documentation.md
  scripts/

theme:
  name: material
  logo: images/app_icon.png
  favicon: images/app_icon.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
