name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The API reference is generated from the docstrings
      - "src/digsim/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install "mkdocs<2" "mkdocs-material==9.7.7" "mkdocstrings==1.0.7" "mkdocstrings-python==2.0.9" "ruff==0.17.1"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
