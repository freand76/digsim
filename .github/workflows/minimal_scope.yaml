name: Minimal Scope

# The platforms other than Linux x86_64, with one Python: the tests marked sanity (pytest
# -m sanity, the parts that can differ between platforms, like files and paths, Yosys,
# the Verilog formatter and the native engine), with both engines, and the native engine
# compared with the Python engine. Not Windows arm64 (the dependencies of DigSim don't
# load there) or musl Linux (no PySide6 wheels).

on: [push]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    defaults:
      run:
        # Also on Windows, for the scripts that compare the engines
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: Set Windows timezone
      if: runner.os == 'Windows'
      run: tzutil /s "W. Europe Standard Time"
      shell: powershell

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install digsim
      run: python -m pip install . "pytest==9.1.1"

    - name: Check that the native engine is used
      run: python -c "from digsim.circuit import _native; assert _native.mode() == 'native'"

    - name: Run netlist example
      run: python examples/yosys_counter/example_yosys_counter_netlist.py

    - name: Run verilog example
      run: python examples/yosys_counter/example_yosys_counter_verilog.py

    - name: Execute pytest (minimal scope)
      run: python -m pytest -q -m sanity

    - name: Execute pytest (minimal scope) with the Python engine
      run: DIGSIM_ENGINE=python python -m pytest -q -m sanity

    - name: Compare the engines
      run: |
        PYTHON=python sh tools/native/compare_engines.sh
        PYTHON=python sh tools/native/fuzz_engines.sh 1 10
