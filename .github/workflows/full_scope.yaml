name: Full Scope

# All of the tests, on Linux x86_64 with each Python, with the native engine and with the
# Python engine. The other platforms run the minimal scope (minimal_scope.yaml). The
# engine job tests digsim-engine on its own, without the GUI.

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Set timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "Europe/Stockholm"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install digsim
      # The engine from engine/, digsim-logic-simulator pins its version
      run: pip install ./engine .
    - name: Run netlist example
      run: python examples/yosys_counter/example_yosys_counter_netlist.py
    - name: Run verilog example
      run: python examples/yosys_counter/example_yosys_counter_verilog.py
    - name: Install pytest
      run: pip install "pytest==9.1.1" "pytest-md==0.2.0" "pytest-emoji==0.2.0"
    - name: Execute pytest
      uses: pavelzw/pytest-action@v2
      with:
        emoji: false
        verbose: false
        job-summary: true
    - name: Execute pytest with the Python engine
      run: DIGSIM_ENGINE=python python -m pytest -q

  engine:
    # The engine as a package of its own, without the GUI and PySide6: the tests that
    # aren't the GUI's
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install digsim-engine
      run: pip install ./engine "pytest==9.1.1"
    - name: Check that the GUI isn't installed
      run: python -c "import importlib.util as u; assert u.find_spec('PySide6') is None"
    - name: Execute pytest
      run: python -m pytest -q --ignore=tests/app
    - name: Execute pytest with the Python engine
      run: DIGSIM_ENGINE=python python -m pytest -q --ignore=tests/app
