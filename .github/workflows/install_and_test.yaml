name: Install and Test

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Set timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "Europe/Stockholm"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install digsim
      run: pip install .
    - name: Run netlist example
      run: python examples/yosys_counter/example_yosys_counter_netlist.py
    - name: Run verilog example
      run: python examples/yosys_counter/example_yosys_counter_verilog.py
    - name: Install pytest
      run: pip install "pytest==9.1.1" "pytest-md==0.2.0" "pytest-emoji==0.2.0"
    - name: Execute pytest
      uses: pavelzw/pytest-action@v2
      with:
        emoji: false
        verbose: false
        job-summary: true
