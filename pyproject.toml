[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digsim-logic-simulator"
description = "Interactive Digital Logic Simulator"
version = "1.9.0"
authors = [{name = "Fredrik Andersson", email = "freand@gmail.com"}]
maintainers =  [{name = "Fredrik Andersson", email = "freand@gmail.com"}]
readme = "README.md"
license-files = ["LICENSE.md"]
urls = { homepage = "https://github.com/freand76/digsim", documentation = "https://freand76.github.io/digsim/" }

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.11"
dependencies = [
  "pyvcd==0.5.0",
  "pyside6==6.12.0",
  "platformdirs==4.9.4",
  "pydantic==2.14.1",
  "yowasp-yosys==0.70.0.0.post1259",
  # Runs Yosys in-process: yowasp-yosys accepts any 1.x, and it decides the wasmtime versions
  "yowasp-runtime==1.96",
  "wasmtime==47.0.1",
  # The native engine (https://github.com/freand76/digsim-native), on the platforms it has
  # wheels for. Without it DigSim simulates in Python
  "digsim-native==0.1.0; (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64') or (sys_platform == 'win32' and platform_machine in 'AMD64 ARM64') or sys_platform == 'darwin'",
]

scripts = { digsim-logic-simulator = "digsim.app.cli:main" }

keywords = ["educational", "simulation", "digital"]

[tool.uv]
# Rebuild the cached package when the sources change, not only pyproject.toml,
# so that "uvx ." and "uv tool run ." run the current code
cache-keys = [
  { file = "pyproject.toml" },
  { file = "MANIFEST.in" },
  { file = "src/**/*.py" },
  { file = "src/**/*.json" },
  { file = "src/**/*.png" },
  { file = "setup.py" },
  { file = "circuits/**" },
]

[tool.pytest.ini_options]
markers = [
  # The minimal scope: run on the other platforms, all of the tests run on Linux
  "sanity: also run on Windows, macOS and Linux arm64 (pytest -m sanity)",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yowasp_yosys"]
ignore_missing_imports = true

[tool.ruff]
line-length = 99
target-version = "py311"

show-fixes = true
output-format = "full"

src = ["src"]
namespace-packages = ["src/digsim"]

[tool.ruff.lint]
# "extend" here adds to the ruff defaults, rather than replacing.
# Q = flake8-quotes, TID = flake8-tidy-imports, I = isort, FA = flake8-future-annotations
extend-select = ["Q", "TID", "I", "FA"]
# E501 = "line too long". Handled by black.
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
lines-after-imports = 2

known-third-party = [
    "platformdirs",
    "pytest",
    "pyvcd",
    "yowasp-yosys",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "PySide6",
    "pyqtgraph",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"PySide6" = ["PySide6"]
"pyqtgraph" = ["pyqtgraph"]
